name: Rebuild factor-first backtest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest_engine.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add backtest_results.csv backtest_detailed_results.csv backtest_results_archive.csv backtest_detailed_results_archive.csv 2>/dev/null || true
          git commit -m "Rebuild 10-year backtest with factor-first selection" || echo "nothing to commit"
          git push
